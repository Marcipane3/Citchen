<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#c8632e" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Mein Kochbuch</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap');
  :root{
    --accent:#c8632e; --accent2:#e8a13a; --ink:#2a1f17;
    --paper:#f6efe3; --card:#fffaf2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{font-family:'Karla',sans-serif;background:var(--paper);color:var(--ink);
    max-width:640px;margin:0 auto;min-height:100vh;
    background-image:radial-gradient(rgba(42,31,23,.03) 1px,transparent 1px);
    background-size:16px 16px;padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:10;background:var(--paper);
    padding:calc(18px + env(safe-area-inset-top)) 18px 10px;border-bottom:1px solid rgba(42,31,23,.09)}
  .brand{display:flex;align-items:center;gap:12px;color:var(--accent);margin-bottom:14px;justify-content:space-between}
  .brand-l{display:flex;align-items:center;gap:12px}
  h1{font-family:'Fraunces',serif;font-size:26px;color:var(--ink);letter-spacing:-.5px}
  .sub{font-size:13px;color:rgba(42,31,23,.6);font-weight:500}
  .icon-btn{background:var(--card);border:1.5px solid rgba(42,31,23,.13);border-radius:12px;
    padding:7px 9px;color:var(--ink);cursor:pointer;display:flex;align-items:center;font-size:15px;line-height:1}
  .icon-btn.close{color:#c0392b;border-color:rgba(192,57,43,.35);font-size:17px;font-weight:700}
  .search-wrap{display:flex;align-items:center;gap:8px;background:var(--card);
    border:1.5px solid rgba(42,31,23,.1);border-radius:14px;padding:10px 14px;margin-bottom:12px}
  .search-wrap input{flex:1;border:none;background:transparent;font-size:15px;font-family:inherit;color:var(--ink);outline:none}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .chips::-webkit-scrollbar{height:0}
  .chip{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid rgba(42,31,23,.13);
    background:transparent;font:600 13px 'Karla';color:rgba(42,31,23,.67);cursor:pointer;white-space:nowrap}
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  main{padding:16px 18px 120px}
  .card{position:relative;display:block;width:100%;text-align:left;background:var(--card);
    border:1.5px solid rgba(42,31,23,.13);border-radius:16px;padding:16px 18px;cursor:pointer;
    box-shadow:0 2px 0 rgba(42,31,23,.06);font-family:inherit;color:var(--ink);margin-bottom:12px;transition:transform .1s}
  .card:active{transform:scale(.98)}
  .card-thumb{width:100%;height:150px;border-radius:12px;background:rgba(42,31,23,.06) center/cover no-repeat;
    margin-bottom:12px;display:none}
  .card-thumb.has-img{display:block}
  .cat{display:inline-block;font:700 11px 'Karla';text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin-bottom:6px}
  .name{font-family:'Fraunces',serif;font-size:19px;font-weight:600;line-height:1.2;margin-bottom:8px;padding-right:30px}
  .meta{display:flex;gap:8px;font-size:13px;color:rgba(42,31,23,.53);font-weight:500;flex-wrap:wrap;align-items:center}
  .card-heart{position:absolute;top:12px;right:12px;background:none;border:none;font-size:22px;cursor:pointer;line-height:1;padding:4px;z-index:2}
  .rate-mini{color:var(--accent2);letter-spacing:1px}
  .empty{text-align:center;color:rgba(42,31,23,.4);margin-top:60px;font-size:15px;line-height:1.6}
  .fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));right:max(24px,calc(50% - 296px));
    width:58px;height:58px;border-radius:18px;background:var(--accent);color:#fff;border:none;
    font-size:30px;cursor:pointer;box-shadow:0 6px 20px rgba(200,99,46,.35);z-index:20;transition:transform .12s}
  .fab:active{transform:scale(.92)}
  .overlay{position:fixed;inset:0;background:rgba(42,31,23,.4);backdrop-filter:blur(3px);
    z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
    border-radius:24px 24px 0 0;padding:20px 20px calc(32px + env(safe-area-inset-bottom));
    animation:slideUp .28s cubic-bezier(.16,1,.3,1)}
  @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
  .sheet-head .hd-r{display:flex;gap:8px;align-items:center}
  .hero{width:100%;height:210px;border-radius:18px;background:rgba(42,31,23,.06) center/cover no-repeat;margin:8px 0 6px;display:none}
  .hero.has-img{display:block}
  .detail-name{font-family:'Fraunces',serif;font-size:28px;font-weight:700;margin:4px 0 8px;line-height:1.15}
  h3{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--accent);margin:22px 0 10px}
  ul,ol{padding-left:22px}
  li{font-size:15px;line-height:1.7;margin-bottom:4px}
  .tips{font-size:15px;line-height:1.6;background:rgba(232,161,58,.13);padding:12px 14px;border-radius:12px}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
  .badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(42,31,23,.07);color:rgba(42,31,23,.7);white-space:nowrap}
  .badge.alltag{background:rgba(76,154,107,.16);color:#3a7a52}
  .badge.besonders{background:rgba(232,161,58,.18);color:#a9701a}
  .badge.prep{background:rgba(91,140,200,.15);color:#3f6aa0}
  .badge.totry{background:rgba(200,91,140,.15);color:#a03f6a}
  .card-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .card-badges .badge{font-size:11px;padding:2px 7px}
  .heart{background:none;border:none;font-size:24px;cursor:pointer;line-height:1;padding:0}
  .stars{font-size:26px;letter-spacing:3px;cursor:pointer;user-select:none;margin:2px 0 8px}
  .stars .star{color:rgba(42,31,23,.18)}
  .stars .star.on{color:var(--accent2)}
  .photo-add{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);
    border:1.5px dashed rgba(42,31,23,.28);border-radius:12px;padding:12px;width:100%;
    font:600 14px 'Karla';color:var(--ink);cursor:pointer;margin-top:10px}
  .photostrip{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px}
  .photostrip::-webkit-scrollbar{height:0}
  .photostrip .ph{position:relative;flex-shrink:0}
  .photostrip .ph .thumb{width:96px;height:96px;border-radius:12px;background:rgba(42,31,23,.06) center/cover no-repeat}
  .photostrip .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:none;
    border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:13px;line-height:1}
  label{display:block;font:700 13px 'Karla';color:rgba(42,31,23,.67);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.4px}
  input.f,textarea.f,select.f{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid rgba(42,31,23,.13);
    background:var(--card);font:15px 'Karla';color:var(--ink);outline:none}
  input.f:focus,textarea.f:focus,select.f:focus{outline:2px solid var(--accent)}
  textarea.f{resize:vertical}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:7px}
  .row .num{flex-shrink:0;width:24px;text-align:right;font:700 14px 'Karla';color:rgba(42,31,23,.4)}
  .row input{flex:1}
  .row .rm{flex-shrink:0;background:transparent;border:1.5px solid rgba(42,31,23,.14);border-radius:10px;
    padding:10px 12px;color:#b3401f;cursor:pointer;font-size:14px}
  .addrow{background:transparent;border:none;color:var(--accent);font:700 14px 'Karla';cursor:pointer;padding:8px 0 2px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
  .btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);
    color:var(--paper);border:none;border-radius:14px;padding:14px;font:700 15px 'Karla';cursor:pointer}
  .btn-cook{background:var(--accent);color:#fff}
  .btn-sec{display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;
    border:1.5px solid rgba(42,31,23,.16);border-radius:14px;padding:14px;font:700 15px 'Karla';color:var(--ink);cursor:pointer}
  .btn-del{color:#b3401f}
  .save{width:100%;margin-top:24px;background:var(--accent);color:#fff;border:none;border-radius:14px;
    padding:15px;font:700 16px 'Karla';cursor:pointer}
  .login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:24px;gap:16px}
  .login h2{font-family:'Fraunces',serif;font-size:24px}
  .login p{color:rgba(42,31,23,.6);font-size:15px;line-height:1.6;max-width:320px}
  .gbtn{background:var(--ink);color:var(--paper);border:none;border-radius:14px;padding:14px 24px;font:700 15px 'Karla';cursor:pointer}
  .sync{font-size:12px;color:rgba(42,31,23,.5);text-align:center;padding:6px}
  .build{font-size:10px;color:rgba(42,31,23,.28);text-align:center;padding:0 0 10px}
  /* ---- Kochmodus ---- */
  .cook{position:fixed;inset:0;background:var(--paper);z-index:60;overflow-y:auto;
    max-width:640px;margin:0 auto;
    padding:calc(16px + env(safe-area-inset-top)) 22px calc(48px + env(safe-area-inset-bottom))}
  .cook-top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;
    background:var(--paper);padding:8px 0 12px;margin-bottom:6px}
  .cook-top .ct{font-family:'Fraunces',serif;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--accent)}
  .cook h2{font-family:'Fraunces',serif;font-size:26px;line-height:1.15;margin-bottom:4px}
  .cook .wakeinfo{font-size:12px;color:rgba(42,31,23,.45);margin-bottom:14px}
  .cook-sec{font-family:'Fraunces',serif;font-size:18px;color:var(--accent);margin:18px 0 8px}
  .cook-ing{display:flex;gap:12px;align-items:flex-start;padding:11px 0;font-size:17px;line-height:1.45;
    border-bottom:1px solid rgba(42,31,23,.07);cursor:pointer}
  .cook-ing.done{opacity:.4;text-decoration:line-through}
  .cook-step{display:flex;gap:14px;align-items:flex-start;padding:16px 0;font-size:19px;line-height:1.5;
    border-bottom:1px solid rgba(42,31,23,.1);cursor:pointer}
  .cook-step.done{opacity:.42;text-decoration:line-through}
  .cook-num{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font:700 15px 'Karla'}
  .tick{flex-shrink:0;width:24px;height:24px;border-radius:7px;border:2px solid rgba(42,31,23,.25);margin-top:2px}
  .done .tick{background:var(--accent);border-color:var(--accent)}
  .cook-done-btn{width:100%;margin-top:28px;background:var(--ink);color:var(--paper);border:none;
    border-radius:14px;padding:15px;font:700 16px 'Karla';cursor:pointer}
  /* Kochmodus: Umschalter Übersicht/Pager */
  .modeswitch{display:flex;background:rgba(42,31,23,.07);border-radius:10px;padding:3px}
  .modeswitch .ms{border:none;background:transparent;font:700 12px 'Karla';color:rgba(42,31,23,.55);
    padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .modeswitch .ms.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(42,31,23,.12)}
  .foldhead{cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .foldhead .chev{font-size:14px;color:rgba(42,31,23,.5)}
  .cook-step .cook-text{flex:1}
  .step-timer{flex-shrink:0;align-self:center;background:var(--card);border:1.5px solid rgba(42,31,23,.18);
    border-radius:10px;padding:6px 9px;font:700 13px 'Karla';color:var(--accent);cursor:pointer;white-space:nowrap}
  .step-timer.running{background:var(--accent);color:#fff;border-color:var(--accent)}
  .step-timer.fired{background:#2e7d32;color:#fff;border-color:#2e7d32}
  .reset-prog{background:none;border:none;color:var(--accent);font:700 12px 'Karla';cursor:pointer;text-decoration:underline;padding:0;margin-left:6px}
  .pager{margin-top:8px}
  .pager-count{font:700 13px 'Karla';color:rgba(42,31,23,.5);text-align:center;margin-bottom:10px}
  .pager-step{display:flex;gap:16px;align-items:flex-start;background:var(--card);
    border:1.5px solid rgba(42,31,23,.12);border-radius:16px;padding:20px;min-height:150px}
  .pager-step.done{opacity:.5}
  .cook-num.big{width:44px;height:44px;font-size:18px}
  .pager-text{flex:1;font-size:22px;line-height:1.45}
  .pager-timer{width:100%;margin-top:14px;background:var(--card);border:1.5px solid rgba(42,31,23,.2);
    border-radius:14px;padding:14px;font:700 16px 'Karla';color:var(--accent);cursor:pointer}
  .pager-timer.running{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pager-timer.fired{background:#2e7d32;color:#fff;border-color:#2e7d32}
  .pager-nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
  .pager-nav button{padding:13px 6px;font-size:14px}
  /* Feedback-/Notizfeld für Claude */
  .fb{width:100%;min-height:70px;margin-top:4px}
  .fb-save{margin-top:8px}
  .fb-note{font-size:12px;color:rgba(42,31,23,.5);margin-top:6px;line-height:1.5}
  /* ---- Menü + Einkaufsliste ---- */
  .menu-btn{font-size:18px}
  .menu-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
    border:1.5px solid rgba(42,31,23,.13);border-radius:14px;padding:16px 18px;margin-top:10px;
    font:700 16px 'Karla';color:var(--ink);cursor:pointer}
  .menu-item.on{border-color:var(--accent);color:var(--accent)}
  .shop-add{display:flex;gap:8px;margin-top:10px}
  .shop-add input{flex:1;border:1.5px solid rgba(42,31,23,.13);border-radius:12px;padding:10px 12px;
    font:15px 'Karla';background:var(--card);color:var(--ink);outline:none}
  .shop-add input:focus{outline:2px solid var(--accent)}
  .add-custom{flex-shrink:0;background:var(--accent);color:#fff;border:none;border-radius:12px;
    padding:0 14px;font:700 14px 'Karla';cursor:pointer}
  .sl-top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 2px}
  .sl-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600}
  .sl-clear{background:none;border:none;color:var(--accent);font:700 13px 'Karla';cursor:pointer;text-decoration:underline}
  .sl-cat{font:700 11px 'Karla';text-transform:uppercase;letter-spacing:.5px;color:rgba(42,31,23,.45);margin:14px 0 4px}
  .sl-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(42,31,23,.07)}
  .sl-item.done .sl-name{text-decoration:line-through;opacity:.45}
  .sl-ic{font-size:20px;flex-shrink:0;width:24px;text-align:center}
  .sl-name{flex:1;font-size:16px;cursor:pointer}
  .sl-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .sl-dec,.sl-inc{width:30px;height:30px;border-radius:8px;border:1.5px solid rgba(42,31,23,.18);
    background:var(--card);font:700 17px 'Karla';color:var(--ink);cursor:pointer;line-height:1;padding:0}
  .sl-qty{min-width:18px;text-align:center;font:700 15px 'Karla'}
  .sl-rm{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:#b3401f;font-size:15px;cursor:pointer}
  .cat-sec{margin-bottom:8px}
  .cat-head{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);
    border:1.5px solid rgba(42,31,23,.13);border-radius:12px;padding:13px 15px;font:700 15px 'Karla';
    color:var(--ink);cursor:pointer;gap:8px}
  .cat-head .chev{color:rgba(42,31,23,.45);font-size:13px}
  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:8px 0 4px}
  .cat-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);
    border:1.5px solid rgba(42,31,23,.12);border-radius:12px;padding:12px 6px;font:600 12px 'Karla';
    color:var(--ink);cursor:pointer;text-align:center;transition:transform .12s,border-color .12s}
  .cat-item .ci-ic{font-size:24px}
  .cat-item .ci-nm{line-height:1.2}
  .cat-item.just-added{transform:scale(.93);border-color:var(--accent)}
  .ci-badge{position:absolute;top:-7px;right:-7px;background:var(--accent);color:#fff;border-radius:11px;
    min-width:22px;height:22px;font:700 12px 'Karla';display:flex;align-items:center;justify-content:center;padding:0 5px}
  /* Zutaten -> Einkaufsliste */
  .add-ing-shop{width:100%;margin-top:6px}
  /* ---- Koch-Match (Swipe-Entdeckung) ---- */
  .match-stack{position:relative;background:linear-gradient(135deg,#e8a13a,#c8632e);color:#fff;border:none;
    border-radius:14px;padding:8px 12px;font:700 14px 'Karla';cursor:pointer;display:flex;align-items:center;gap:6px;
    box-shadow:0 3px 10px rgba(200,99,46,.35)}
  .match-stack .ms-count{background:#fff;color:var(--accent);border-radius:10px;min-width:20px;height:20px;
    display:flex;align-items:center;justify-content:center;font:700 12px 'Karla';padding:0 5px}
  .swipe-wrap{padding:8px 18px 30px}
  .swipe-deck{position:relative;height:60vh;max-height:540px;margin:6px auto 0}
  .scard{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:#2a1f17;
    box-shadow:0 10px 30px rgba(42,31,23,.25);will-change:transform;touch-action:pan-y;cursor:grab}
  .scard.behind{transform:scale(.94) translateY(14px);filter:brightness(.95);pointer-events:none}
  .scard-img{position:absolute;inset:0;background:#e9dcc6 center/cover no-repeat;display:flex;
    align-items:center;justify-content:center;font-size:88px}
  .scard-img.has-img,.match-thumb.has-img{font-size:0}
  .scard-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8) 0%,rgba(0,0,0,.2) 46%,rgba(0,0,0,0) 72%)}
  .scard-badges{position:absolute;top:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap;max-width:84%}
  .sb{font:700 11px 'Karla';text-transform:uppercase;letter-spacing:.5px;color:#fff;background:rgba(0,0,0,.42);
    backdrop-filter:blur(4px);padding:6px 10px;border-radius:20px}
  .sb.kind{background:rgba(232,161,58,.95)}
  .scard-info{position:absolute;left:18px;right:18px;bottom:18px;color:#fff}
  .scard-name{font-family:'Fraunces',serif;font-size:26px;font-weight:700;line-height:1.15;margin-bottom:6px;text-shadow:0 2px 8px rgba(0,0,0,.45)}
  .scard-meta{font:600 14px 'Karla';opacity:.96;display:flex;gap:12px;flex-wrap:wrap;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .scard-meta .st{color:var(--accent2)}
  .scard-stamp{position:absolute;top:34px;font:800 26px 'Karla';letter-spacing:2px;padding:6px 16px;
    border:4px solid;border-radius:12px;opacity:0;text-transform:uppercase;pointer-events:none}
  .scard-stamp.like{left:22px;color:#2e7d32;border-color:#2e7d32;transform:rotate(-16deg)}
  .scard-stamp.nope{right:22px;color:#c0392b;border-color:#c0392b;transform:rotate(16deg)}
  .swipe-actions{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:20px}
  .sw-btn{width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;
    box-shadow:0 4px 14px rgba(42,31,23,.18);display:flex;align-items:center;justify-content:center;
    background:var(--card);transition:transform .12s}
  .sw-btn:active{transform:scale(.9)}
  .sw-btn.nope{color:#c0392b}
  .sw-btn.like{color:#fff;background:linear-gradient(135deg,#ff7a45,#c8632e);font-size:28px}
  .sw-btn.undo{width:48px;height:48px;font-size:19px;color:rgba(42,31,23,.55)}
  .swipe-hint{text-align:center;font:600 12px 'Karla';color:rgba(42,31,23,.45);margin-top:14px}
  .swipe-empty{text-align:center;padding:50px 20px;color:rgba(42,31,23,.6);display:flex;flex-direction:column;align-items:center}
  .swipe-empty h3{color:var(--accent);margin:0 0 6px}

let tokenClient;
const TOKEN_KEY = "kb_token";

/* Token im localStorage halten, damit man nicht bei jedem App-Start neu zustimmen muss.
   Hinweis: Der GIS-Token-Flow (clientseitig, ohne Server) liefert KEINEN Refresh-Token.
   Wir speichern daher das kurzlebige Access-Token + Ablaufzeit und erneuern es bei
   Bedarf "silent" (prompt:'') — ohne Popup, solange die Google-Session aktiv ist. */
function saveToken(resp){
  TOKEN = resp.access_token;
  const ttl = (resp.expires_in ? resp.expires_in * 1000 : 3600000) - 60000; // 60s Puffer
  try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ t: TOKEN, e: Date.now() + ttl })); } catch(e){}
}
function loadStoredToken(){
  try {
    const s = JSON.parse(localStorage.getItem(TOKEN_KEY) || "null");
    if (s && s.t && s.e > Date.now()) { TOKEN = s.t; return true; }
  } catch(e){}
  return false;
}
function clearToken(){ TOKEN = null; try { localStorage.removeItem(TOKEN_KEY); } catch(e){} }

function initGoogle() {
  if (tokenClient) return;  // nur einmal initialisieren (window.onload + GIS-onload)
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID, scope: SCOPE,
    callback: (resp) => { if (resp && resp.access_token){ saveToken(resp); afterLogin(); } },
    error_callback: () => { /* silent-Refresh nicht möglich → Login-Button bleibt sichtbar */ }
  });
  // Auto-Login: gültiges Token aus dem Speicher nutzen, sonst lautlos erneuern versuchen.
  if (loadStoredToken()) { afterLogin(); }
  else { try { tokenClient.requestAccessToken({ prompt: "" }); } catch(e){} }
}
function login(){ tokenClient.requestAccessToken(); }  // explizit (mit Popup), für den Button

async function driveFind() {
  const q = encodeURIComponent(`name='${FILE_NAME}' and trashed=false`);
  const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`,
    { headers: { Authorization: "Bearer " + TOKEN } });
  if (!r.ok) throw new Error("Drive find " + r.status);   // z.B. 401 → Token ungültig
  const j = await r.json();
  return j.files && j.files.length ? j.files[0].id : null;
}
async function driveRead(id) {
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,
    { headers: { Authorization: "Bearer " + TOKEN } });
  if (!r.ok) throw new Error("Drive read " + r.status);
  return r.json();
}
async function driveCreate(data) {
  const meta = { name: FILE_NAME, mimeType: "application/json" };
  const body = new FormData();
  body.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" }));
  body.append("file", new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  const r = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
    { method: "POST", headers: { Authorization: "Bearer " + TOKEN }, body });
  return (await r.json()).id;
}
async function driveUpdate(id, data) {
  await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,
    { method: "PATCH", headers: { Authorization: "Bearer " + TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify(data, null, 2) });
}
/* --- Bild-Dateien (eigene Drive-Dateien, per fileId referenziert) --- */
async function driveUploadImage(blob, name) {
  const meta = { name, mimeType: blob.type || "image/jpeg" };
  const body = new FormData();
  body.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" }));
  body.append("file", blob);
  const r = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
    { method: "POST", headers: { Authorization: "Bearer " + TOKEN }, body });
  return (await r.json()).id;
}
async function driveDelete(id) {
  try {
    await fetch(`https://www.googleapis.com/drive/v3/files/${id}`,
      { method: "DELETE", headers: { Authorization: "Bearer " + TOKEN } });
  } catch (e) { /* still missing? egal */ }
}
async function driveImageUrl(fileId) {
  if (imgCache.has(fileId)) return imgCache.get(fileId);
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
    { headers: { Authorization: "Bearer " + TOKEN } });
  if (!r.ok) throw new Error("Bild nicht ladbar");
  const url = URL.createObjectURL(await r.blob());
  imgCache.set(fileId, url);
  return url;
}

    clearToken();

}

/* Bild clientseitig verkleinern + als JPEG komprimieren, bevor es zu Drive geht. */
function compressImage(file, maxDim=1280, quality=0.72){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if (h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        c.toBlob(b => b ? res(b) : rej(new Error("Komprimierung fehlgeschlagen")), "image/jpeg", quality);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* Wiederverwendbarer Zeilen-Editor (Zutaten / Schritte). Gibt einen Getter zurück. */
function makeListEditor(mount, initial, ph, numbered){
  const wrap = document.createElement("div");
  function addRow(val){
    const row = $(`<div class="row">${numbered?'<span class="num"></span>':''}<input class="f"><button class="rm" type="button">✕</button></div>`);
    row.querySelector("input").value = val || "";
    row.querySelector("input").placeholder = ph;
    row.querySelector(".rm").onclick = () => { row.remove(); renum(); };
    row.querySelector("input").addEventListener("keydown", (e)=>{
      if (e.key === "Enter"){ e.preventDefault(); const nr = addRow(""); nr.querySelector("input").focus(); }
    });
    wrap.appendChild(row); renum(); return row;
  }
  function renum(){ if(!numbered) return;
    Array.from(wrap.querySelectorAll(".num")).forEach((n,i)=> n.textContent = (i+1)+"."); }
  const init = (initial && initial.length) ? initial : [""];
  init.forEach(v => addRow(v));
  const add = $(`<button class="addrow" type="button">+ Zeile hinzufügen</button>`);
  add.onclick = () => { const r = addRow(""); r.querySelector("input").focus(); };
  mount.appendChild(wrap); mount.appendChild(add);
  return () => Array.from(wrap.querySelectorAll("input")).map(i=>i.value.trim()).filter(Boolean);
}

  if(!compact && r.season) b.push(`<span class="badge">${esc(r.season)}</span>`);
  return b.join("");
}
const SPECIAL_LBL = {"__fav":"♥ Favoriten","__alltag":"⚡ Alltag","__besonders":"✨ Besonders","__mealprep":"🍱 Meal-Prep","__totry":"🆕 Probieren"};

    else if (activeCat === "__alltag"){ if (r.effort!=="alltag") return false; }
    else if (activeCat === "__besonders"){ if (r.effort!=="besonders") return false; }
    else if (activeCat === "__mealprep"){ if (!r.mealPrep) return false; }
    else if (activeCat === "__totry"){ if (!r.toTry) return false; }
    else if (activeCat !== "Alle" && r.category !== activeCat) return false;

      (r.ingredients||[]).join(" ").toLowerCase().includes(q);

          <span style="font-size:24px">🍳</span>

        </div>

      </div>
      <div class="search-wrap">
        <span>🔍</span>
        <input id="search" placeholder="Suchen nach Name oder Zutat…" value="${esc(query)}" />
      </div>
      <div class="chips">
        ${cats.map(c=>{
          const lbl = c==="Alle" ? "Alle" : SPECIAL_LBL[c] ? SPECIAL_LBL[c]
            : c.split(":")[0].split(" & ")[0].split(" ")[0];
          return `<button class="chip ${activeCat===c?'active':''}" data-cat="${esc(c)}">${esc(lbl)}</button>`;
        }).join("")}
      </div>
    </header>
    <main>
      ${filtered.length===0
        ? `<p class="empty">${activeCat==="__fav"?"Noch keine Favoriten.<br>Öffne ein Rezept und tippe auf ♥.":"Noch keine Rezepte hier.<br>Tippe auf + um eins hinzuzufügen."}</p>`
        : filtered.map(r=>{
          const hasImg = (r.photos&&r.photos.length)||r.image;
          return `
          <div class="card" data-id="${r.id}">
            <button class="card-heart" data-fav="${r.id}">${r.favorite?"♥":"♡"}</button>
            ${hasImg?`<div class="card-thumb" data-hero="${r.id}"></div>`:""}
            <div class="cat">${esc(r.category)}</div>

            <div class="meta">${r.time?`⏱ ${esc(r.time)}`:""} ${r.lastCooked?`· ${esc(r.lastCooked)}`:""} ${starsMini(r.rating)}</div>
            ${metaBadges(r,true)?`<div class="card-badges">${metaBadges(r,true)}</div>`:""}
          </div>`;}).join("")}

function paintList(){
  const el = document.getElementById("shop-list"); if(!el) return;
  const doneCount = SHOP.filter(x=>x.done).length, openCount = SHOP.length - doneCount;
  const sub = document.getElementById("shop-sub");

  if(!SHOP.length){ el.innerHTML = `<p class="empty">Liste ist leer.<br>Tippe unten auf Artikel oder füge oben eigene hinzu.</p>`; return; }
  const order = CATALOG.map(s=>s.name).concat(["Sonstiges"]);
  const cats = [...new Set(SHOP.map(x=>x.cat))].sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  let html = `<div class="sl-top"><div class="sl-title">Meine Liste</div>${doneCount?`<button class="sl-clear">Erledigte entfernen</button>`:""}</div>`;
  cats.forEach(cat=>{
    const catIcon = (CATALOG.find(s=>s.name===cat)||{}).icon || "🛒";
    html += `<div class="sl-cat">${catIcon} ${esc(cat)}</div>`;
    SHOP.forEach((it,i)=>{ if(it.cat!==cat) return;
      html += `<div class="sl-item ${it.done?"done":""}">
        <span class="sl-ic">${it.icon||"🛒"}</span>
        <span class="sl-name" data-i="${i}">${esc(it.name)}</span>

          <button class="sl-dec" data-i="${i}">−</button>

          <button class="sl-inc" data-i="${i}">+</button>
          <button class="sl-rm" data-i="${i}">✕</button>
        </div>
      </div>`;
    });
  });
  el.innerHTML = html;
  el.querySelectorAll(".sl-name").forEach(n=>n.onclick=()=>{ const it=SHOP[+n.dataset.i]; if(it){ it.done=!it.done; saveShopping(); paintList(); } });
  el.querySelectorAll(".sl-dec").forEach(b=>b.onclick=()=>{ const it=SHOP[+b.dataset.i]; if(!it)return; it.qty--; if(it.qty<=0) SHOP.splice(+b.dataset.i,1); saveShopping(); paintList(); paintCatalog(); });
  el.querySelectorAll(".sl-inc").forEach(b=>b.onclick=()=>{ const it=SHOP[+b.dataset.i]; if(it){ it.qty++; saveShopping(); paintList(); paintCatalog(); } });
  el.querySelectorAll(".sl-rm").forEach(b=>b.onclick=()=>{ SHOP.splice(+b.dataset.i,1); saveShopping(); paintList(); paintCatalog(); });
  const clr = el.querySelector(".sl-clear"); if(clr) clr.onclick=()=>{ SHOP=SHOP.filter(x=>!x.done); saveShopping(); paintList(); paintCatalog(); };
}

/* ============================================================
   KOCH-MATCH — Swipe-Entdeckung (Tinder-Stil)
   ============================================================ */
let swipeOrder=[], swipeIdx=0, swipeMatches=[], swipeHistory=[];
function loadMatches(){ try{ const a=JSON.parse(localStorage.getItem("kb_matches")||"[]"); return a.filter(id=>DATA.recipes.some(r=>r.id===id)); }catch(e){ return []; } }
function saveMatches(){ try{ localStorage.setItem("kb_matches", JSON.stringify(swipeMatches)); }catch(e){} }
function shuffleArr(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* Wochentags- vs. Wochenend-Gericht aus Zeit/Kategorie ableiten (für das Karten-Badge). */
function dishKind(r){
  const m=parseMinutes(r.time);
  const wkCat=["Wochenend-Gerichte","Backen: Süßes & Kuchen","Sourdough & Sauerteig","Backen: Brot & Herzhaftes"].includes(r.category);
  if(wkCat || (m && m>40)) return { label:"Wochenende", icon:"🍷" };
  return { label:"Wochentags", icon:"⚡" };
}

function renderSwipe(){
  appView="swipe";
  swipeMatches=loadMatches();
  swipeHistory=[];
  swipeOrder=shuffleArr(DATA.recipes.filter(r=>!swipeMatches.includes(r.id)).map(r=>r.id));
  swipeIdx=0;
  const app=document.getElementById("app");
  app.innerHTML=`
    <header>
      <div class="brand">
        <div class="brand-l">
          <span style="font-size:24px">🔥</span>
          <div><h1>Koch-Match</h1><div class="sub">Swipe dich durch deine Rezepte</div></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="match-stack" id="matchStack" title="Deine Matches">🔥 <span class="ms-count">0</span></button>
          <button class="icon-btn menu-btn" id="menuBtn" title="Menü">☰</button>
        </div>
      </div>
    </header>
    <main class="swipe-wrap">
      <div class="swipe-deck" id="deck"></div>
      <div class="swipe-actions" id="swipeActions">
        <button class="sw-btn undo" id="swUndo" title="Zurück">↩︎</button>
        <button class="sw-btn nope" id="swNope" title="Nö">✕</button>
        <button class="sw-btn like" id="swLike" title="Lecker!">🔥</button>
      </div>
      <div class="swipe-hint">Nach rechts wischen = Match · nach links = weiter</div>
    </main>
    <div class="build">Build ${esc(BUILD)}</div>`;
  document.getElementById("menuBtn").onclick=openMenu;
  document.getElementById("matchStack").onclick=openMatches;
  paintSwipe();
}

function updateStackBadge(){ const c=document.querySelector(".ms-count"); if(c) c.textContent=swipeMatches.length; }

function scardHTML(r, behind){
  const k=dishKind(r);
  const hasImg=(r.photos&&r.photos.length)||r.image;
  return `<div class="scard ${behind?"behind":""}" data-id="${r.id}">
    <div class="scard-img" data-hero="${r.id}">${hasImg?"":"🍽"}</div>
    <div class="scard-grad"></div>
    <div class="scard-badges">
      <span class="sb cat">${esc(r.category)}</span>
      <span class="sb kind">${k.icon} ${k.label}</span>
    </div>
    <div class="scard-info">
      <div class="scard-name">${esc(r.name)}</div>
      <div class="scard-meta">
        ${r.time?`<span>⏱ ${esc(r.time)}</span>`:""}
        ${r.rating?`<span class="st">${"★".repeat(r.rating)}</span>`:""}
        <span>🥗 ${(r.ingredients||[]).length} Zutaten</span>
      </div>
    </div>
    <div class="scard-stamp like">Lecker</div>
    <div class="scard-stamp nope">Nö</div>
  </div>`;
}

function paintSwipe(){
  const deck=document.getElementById("deck"); if(!deck) return;
  updateStackBadge();
  const sa=document.getElementById("swipeActions");
  if(swipeIdx>=swipeOrder.length){
    if(sa) sa.style.display="none";
    deck.innerHTML=`<div class="swipe-empty">
      <h3>Alles durchgeswipt! 🎉</h3>
      <p>${swipeMatches.length} Match${swipeMatches.length===1?"":"es"} in deinem Stapel.</p>
      <button class="btn-primary" id="swShowMatches" style="margin-top:16px">🔥 Matches ansehen</button>
      <button class="btn-sec" id="swRestart" style="margin-top:10px">↻ Nochmal von vorn</button>
    </div>`;
    const sm=document.getElementById("swShowMatches"); if(sm) sm.onclick=openMatches;
    const sr=document.getElementById("swRestart"); if(sr) sr.onclick=()=>{
      swipeOrder=shuffleArr(DATA.recipes.map(r=>r.id)); swipeIdx=0; swipeHistory=[]; paintSwipe();
    };
    return;
  }
  if(sa) sa.style.display="";
  const cur=DATA.recipes.find(x=>x.id===swipeOrder[swipeIdx]);
  const nextId=swipeOrder[swipeIdx+1];
  const next=nextId?DATA.recipes.find(x=>x.id===nextId):null;
  deck.innerHTML=(next?scardHTML(next,true):"")+(cur?scardHTML(cur,false):"");
  hydrateImages(deck);
  const top=deck.querySelector(".scard:not(.behind)");
  if(top) attachDrag(top);
  document.getElementById("swUndo").onclick=undoSwipe;
  document.getElementById("swNope").onclick=()=>buttonSwipe("nope");
  document.getElementById("swLike").onclick=()=>buttonSwipe("like");
}

function attachDrag(card){
  let startX=0,dx=0,dragging=false;
  const like=card.querySelector(".scard-stamp.like"), nope=card.querySelector(".scard-stamp.nope");
  card.onpointerdown=(e)=>{ dragging=true; startX=e.clientX; dx=0; try{card.setPointerCapture(e.pointerId);}catch(_){ } card.style.transition="none"; };
  card.onpointermove=(e)=>{ if(!dragging)return;
    dx=e.clientX-startX;
    card.style.transform=`translate(${dx}px, ${Math.abs(dx)*0.06}px) rotate(${dx/18}deg)`;
    const o=Math.min(Math.abs(dx)/120,1);
    if(dx>0){ like.style.opacity=o; nope.style.opacity=0; } else { nope.style.opacity=o; like.style.opacity=0; }
  };
  const end=()=>{ if(!dragging)return; dragging=false;
    card.style.transition="transform .32s cubic-bezier(.16,1,.3,1), opacity .32s ease-out";
    if(Math.abs(dx)>110){ flyOut(card, dx>0?"like":"nope"); }
    else { card.style.transform=""; like.style.opacity=0; nope.style.opacity=0; }
    dx=0;
  };
  card.onpointerup=end; card.onpointercancel=end;
}
function flyOut(card, dir){
  card.style.transition="transform .3s ease-out, opacity .3s ease-out";
  const x=(dir==="like"?1:-1)*((window.innerWidth||420)+200);
  card.style.transform=`translate(${x}px, -40px) rotate(${dir==="like"?26:-26}deg)`;
  card.style.opacity="0";
  setTimeout(()=>commitSwipe(dir), 250);
}
function buttonSwipe(dir){
  const deck=document.getElementById("deck"); if(!deck){ return; }
  const top=deck.querySelector(".scard:not(.behind)");
  if(!top){ commitSwipe(dir); return; }
  flyOut(top, dir);
}
function commitSwipe(dir){
  const id=swipeOrder[swipeIdx];
  if(dir==="like" && id && !swipeMatches.includes(id)){ swipeMatches.push(id); saveMatches(); }
  swipeHistory.push({ id, dir });
  swipeIdx++;
  paintSwipe();
}
function undoSwipe(){
  const last=swipeHistory.pop();
  if(!last) return;
  swipeIdx=Math.max(0, swipeIdx-1);
  if(last.dir==="like"){ swipeMatches=swipeMatches.filter(x=>x!==last.id); saveMatches(); }
  paintSwipe();
}

/* Goldener Stapel: Matches mit Bild + Kurzinfo; Tippen öffnet das volle Rezept (wie ein Tinder-Profil). */
function openMatches(){
  const ov=$(`<div class="overlay"></div>`);
  const list=swipeMatches.map(id=>DATA.recipes.find(r=>r.id===id)).filter(Boolean);
  ov.innerHTML=`<div class="sheet">
    <div class="sheet-head"><span class="cat">🔥 Deine Matches (${list.length})</span><button class="icon-btn close">✕</button></div>
    ${list.length ? list.map(r=>{
      const hasImg=(r.photos&&r.photos.length)||r.image; const k=dishKind(r);
      return `<div class="match-row" data-id="${r.id}">
        <div class="match-thumb" data-hero="${r.id}">${hasImg?"":"🍽"}</div>
        <div class="match-info"><div class="mn">${esc(r.name)}</div>
          <div class="mm">${esc(r.category)} · ${k.icon} ${k.label}${r.time?` · ⏱ ${esc(r.time)}`:""}${r.rating?` · ${"★".repeat(r.rating)}`:""}</div></div>
        <button class="match-rm" data-rm="${r.id}" title="Entfernen">✕</button>
      </div>`;
    }).join("") : `<p class="empty" style="margin-top:30px">Noch keine Matches.<br>Swipe Rezepte nach rechts.</p>`}
  </div>`;
  document.body.appendChild(ov);
  const isArmed=armSheet(ov); const close=()=>ov.remove();
  ov.onclick=(e)=>{ if(isArmed() && e.target===ov) close(); };
  ov.querySelector(".close").onclick=close;
  hydrateImages(ov);
  ov.querySelectorAll(".match-row").forEach(row=>row.onclick=(e)=>{
    if(e.target.closest(".match-rm")) return;
    close(); openDetail(row.dataset.id);
  });
  ov.querySelectorAll(".match-rm").forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    swipeMatches=swipeMatches.filter(x=>x!==b.dataset.rm); saveMatches();
    close(); updateStackBadge(); openMatches();
  });
}

  document.body.appendChild(ov);
  const isArmed = armSheet(ov);            // verhindert Geister-Klick auf Aktionsbuttons

  // Foto löschen

  ov.querySelector(".cooked").onclick=async(e)=>{

    render();   // Liste im Hintergrund aktualisieren (Zuletzt gekocht / Zähler)

  };
  ov.querySelector(".del").onclick=async()=>{

    (r.photos||[]).forEach(p=>driveDelete(p.id)); // Fotos in Drive mit aufräumen
    DATA.recipes=DATA.recipes.filter(x=>x.id!==id);
    await save(); close(); render();
  };
}

/* ---------- Kochmodus (Vollbild, Bildschirm bleibt an) ---------- */
let wakeLock=null;
async function reqWake(){ try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }catch(e){} }
function relWake(){ try{ wakeLock&&wakeLock.release(); }catch(e){} wakeLock=null; }

/* Fortschritt (abgehakte Schritte/Zutaten) pro Rezept lokal merken — nicht in Drive. */
function progKey(id){ return "kb_prog_"+id; }
function loadProg(id){ try{ const p=JSON.parse(localStorage.getItem(progKey(id))||"{}"); p.steps=p.steps||{}; p.ings=p.ings||{}; return p; }catch(e){ return {steps:{},ings:{}}; } }
function saveProg(id,p){ try{ localStorage.setItem(progKey(id), JSON.stringify(p)); }catch(e){} }

/* Minuten aus Schritttext lesen: "12–15 Min" -> 15, "5 Min" -> 5, sonst null. */
function parseMinutes(text){
  const m = (text||"").match(/(\d+)\s*(?:[–\-]\s*(\d+)\s*)?Min/i);
  return m ? parseInt(m[2]||m[1], 10) : null;
}
/* Signalton + Vibration, wenn ein Countdown abläuft. */
function alarm(){
  try{
    const C=window.AudioContext||window.webkitAudioContext; const ctx=new C();
    [0,0.35,0.7].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type="sine"; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+t+0.28);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.3);
    });
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([300,150,300]); }catch(e){}
}

function openCook(id){
  const r = DATA.recipes.find(x=>x.id===id); if(!r) return;
  const ings = r.ingredients||[], steps = r.steps||[];
  const prog = loadProg(id);
  let mode = "list";      // "list" = Übersicht | "pager" = Schritt für Schritt
  let cur = 0;            // aktueller Schritt im Pager
  let ingOpen = true;     // Zutaten-Block auf/zu
  let intervals = [];     // laufende Countdown-Intervalle (für sauberes Aufräumen beim Neuzeichnen)

  const view = $(`<div class="cook"></div>`);
  document.body.appendChild(view);
  armSheet(view);
  reqWake();
  const exit=()=>{ clearTimers(); relWake(); view.remove(); };
  function clearTimers(){ intervals.forEach(i=>clearInterval(i)); intervals=[]; }

  /* Countdown an einen Button binden. mins=null -> beim Klick nachfragen. */
  function attachTimer(btn, mins, base){
    let iv=null, rem=0;
    const baseLabel = base || ("⏱"+(mins?` ${mins}′`:""));
    const fmt=(s)=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
    btn.classList.remove("running","fired"); btn.textContent=baseLabel;
    btn.onclick=(e)=>{
      e.stopPropagation();                       // nicht den Schritt abhaken
      if(iv){ clearInterval(iv); intervals=intervals.filter(x=>x!==iv); iv=null;
        btn.classList.remove("running"); btn.textContent=baseLabel; return; }
      let m=mins;
      if(!m){ const v=prompt("Countdown – wie viele Minuten?","5"); m=parseInt(v,10); if(!m||m<=0) return; }
      rem=m*60; btn.classList.remove("fired"); btn.classList.add("running"); btn.textContent="⏱ "+fmt(rem);
      iv=setInterval(()=>{
        rem--;
        if(rem<=0){ clearInterval(iv); intervals=intervals.filter(x=>x!==iv); iv=null;
          btn.classList.remove("running"); btn.classList.add("fired"); btn.textContent="✓ fertig!"; alarm(); return; }
        btn.textContent="⏱ "+fmt(rem);
      },1000);
      intervals.push(iv);
    };
  }
  function toggleStep(i){ prog.steps[i]=!prog.steps[i]; if(!prog.steps[i]) delete prog.steps[i]; saveProg(id,prog); }
  function toggleIng(i){ prog.ings[i]=!prog.ings[i]; if(!prog.ings[i]) delete prog.ings[i]; saveProg(id,prog); }

  function ingredientsBlock(){
    if(!ings.length) return "";
    return `<div class="cook-sec foldhead" data-fold>Zutaten <span class="chev">${ingOpen?"▾":"▸"}</span></div>
      <div class="foldbody"${ingOpen?"":' style="display:none"'}>
        ${ings.map((i,idx)=>`<div class="cook-ing ${prog.ings[idx]?"done":""}" data-ing="${idx}"><span class="tick"></span><span>${esc(i)}</span></div>`).join("")}
      </div>`;
  }
  function bodyHTML(){
    if(mode==="list"){
      return `${ingredientsBlock()}
        ${steps.length?`<div class="cook-sec">Zubereitung</div>${steps.map((s,i)=>{
          const mins=parseMinutes(s);
          return `<div class="cook-step ${prog.steps[i]?"done":""}" data-step="${i}">
            <span class="cook-num">${i+1}</span>
            <span class="cook-text">${esc(s)}</span>
            <button class="step-timer" data-mins="${mins||""}"></button>
          </div>`;}).join("")}`:""}`;
    }
    const s=steps[cur]||""; const mins=parseMinutes(s);
    return `${ingredientsBlock()}
      <div class="pager">
        <div class="pager-count">Schritt ${cur+1} / ${steps.length}</div>
        <div class="pager-step ${prog.steps[cur]?"done":""}">
          <span class="cook-num big">${cur+1}</span>
          <div class="pager-text">${esc(s)}</div>
        </div>
        <button class="pager-timer" data-mins="${mins||""}"></button>
        <div class="pager-nav">
          <button class="btn-sec pg-prev" ${cur===0?"disabled":""}>←</button>
          <button class="btn-sec pg-check">${prog.steps[cur]?"✓ erledigt":"Abhaken"}</button>
          <button class="btn-primary pg-next" ${cur>=steps.length-1?"disabled":""}>→</button>
        </div>
      </div>`;
  }
  function paint(){
    clearTimers();
    view.innerHTML = `
      <div class="cook-top">
        <span class="ct">Kochmodus</span>
        <div style="display:flex;gap:8px;align-items:center">
          <div class="modeswitch">
            <button class="ms ${mode==="list"?"on":""}" data-mode="list">Übersicht</button>
            <button class="ms ${mode==="pager"?"on":""}" data-mode="pager">Schritt für Schritt</button>
          </div>
          <button class="icon-btn close">✕</button>
        </div>
      </div>
      <h2>${esc(r.name)}</h2>
      <div class="wakeinfo">📱 Bildschirm bleibt an. Fortschritt wird gemerkt.<button class="reset-prog">zurücksetzen</button></div>
      ${bodyHTML()}
      <button class="cook-done-btn done-btn">Fertig — zurück</button>`;
    wire();
  }
  function wire(){
    view.querySelector(".close").onclick=exit;
    view.querySelector(".done-btn").onclick=exit;
    view.querySelectorAll(".ms").forEach(b=>b.onclick=()=>{ if(mode!==b.dataset.mode){ mode=b.dataset.mode; paint(); } });
    const rp=view.querySelector(".reset-prog");
    if(rp) rp.onclick=()=>{ if(confirm("Abgehakten Fortschritt zurücksetzen?")){ prog.steps={}; prog.ings={}; saveProg(id,prog); paint(); } };

    // Zutaten ein-/ausklappen — ohne Neuzeichnen, damit laufende Timer erhalten bleiben
    const fold=view.querySelector("[data-fold]");
    if(fold) fold.onclick=()=>{
      const fb=view.querySelector(".foldbody"); ingOpen = fb.style.display==="none";
      fb.style.display = ingOpen ? "" : "none";
      fold.querySelector(".chev").textContent = ingOpen ? "▾" : "▸";
    };
    view.querySelectorAll("[data-ing]").forEach(el=>el.onclick=()=>{ toggleIng(+el.dataset.ing); el.classList.toggle("done"); });

    // Übersicht: Schrittzeile abhaken (Timer-Button stoppt Propagation)
    view.querySelectorAll(".cook-step").forEach(el=>el.onclick=()=>{ toggleStep(+el.dataset.step); el.classList.toggle("done"); });

    // Pager-Navigation
    const prev=view.querySelector(".pg-prev"); if(prev) prev.onclick=()=>{ if(cur>0){cur--;paint();} };
    const next=view.querySelector(".pg-next"); if(next) next.onclick=()=>{ if(cur<steps.length-1){cur++;paint();} };
    const chk=view.querySelector(".pg-check"); if(chk) chk.onclick=()=>{ toggleStep(cur); paint(); };

    // Countdown-Buttons (Übersicht: pro Schritt; Pager: aktueller Schritt)
    view.querySelectorAll(".step-timer, .pager-timer").forEach(btn=>{
      const m=parseInt(btn.dataset.mins,10)||null;
      const isPager=btn.classList.contains("pager-timer");
      const base = isPager ? ("⏱ Countdown"+(m?` (${m} Min)`:"")) : ("⏱"+(m?` ${m}′`:""));
      attachTimer(btn, m, base);
    });
  }
  paint();
}

/* ---------- Formular: Neu + Bearbeiten ---------- */
function openForm(existing){
  const ed = existing || null;
  const ov = $(`<div class="overlay"></div>`);
  ov.innerHTML = `<div class="sheet">
    <div class="sheet-head"><span class="cat">${ed?"Rezept bearbeiten":"Neues Rezept"}</span><button class="icon-btn close">✕</button></div>
    <label>Name</label><input class="f" id="f-name" placeholder="z.B. Linsensuppe" />
    <label>Kategorie</label><select class="f" id="f-cat">${CATEGORIES.map(c=>`<option ${ed&&ed.category===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label>Zeit</label><input class="f" id="f-time" placeholder="25 Min" /></div>
      <div style="flex:1"><label>Portionen</label><input class="f" id="f-serv" value="~4" /></div>
    </div>
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label>Aufwand</label><select class="f" id="f-effort"><option value="">—</option><option value="alltag">⚡ Alltag</option><option value="besonders">✨ Besonders</option></select></div>
      <div style="flex:1"><label>Schwierigkeit</label><select class="f" id="f-diff"><option value="">—</option><option>einfach</option><option>mittel</option><option>aufwändig</option></select></div>
    </div>
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label>Küche</label><input class="f" id="f-cuisine" placeholder="z.B. Italienisch" /></div>
      <div style="flex:1"><label>Saison</label><input class="f" id="f-season" placeholder="optional" /></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:6px"><input type="checkbox" id="f-mealprep" style="width:auto"/> 🍱 Meal-Prep (hält ~4 Tage)</label>
    <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="f-totry" style="width:auto"/> 🆕 Zu probieren (noch nie gekocht)</label>
    <label>Bild-URL (optional)</label><input class="f" id="f-image" placeholder="https://… (Titelbild)" />
    <label>Zutaten</label><div id="f-ing"></div>
    <label>Zubereitung</label><div id="f-steps"></div>
    <label>Tipps (optional)</label><textarea class="f" id="f-tips" rows="2"></textarea>
    <button class="save">Speichern</button>
  </div>`;
  document.body.appendChild(ov);
  const isArmed = armSheet(ov);
  const close=()=>ov.remove();
  ov.onclick=(e)=>{ if(isArmed() && e.target===ov) close(); };
  ov.querySelector(".close").onclick=close;

  if (ed){
    ov.querySelector("#f-name").value = ed.name || "";
    ov.querySelector("#f-time").value = ed.time || "";
    ov.querySelector("#f-serv").value = ed.servings || "";
    ov.querySelector("#f-image").value = ed.image || "";
    ov.querySelector("#f-tips").value = ed.tips || "";
    ov.querySelector("#f-effort").value = ed.effort || "";
    ov.querySelector("#f-diff").value = ed.difficulty || "";
    ov.querySelector("#f-cuisine").value = ed.cuisine || "";
    ov.querySelector("#f-season").value = ed.season || "";
    ov.querySelector("#f-mealprep").checked = !!ed.mealPrep;
    ov.querySelector("#f-totry").checked = !!ed.toTry;
  }
  const getIng = makeListEditor(ov.querySelector("#f-ing"), ed?ed.ingredients:[], "z.B. 2 Eier", false);
  const getSteps = makeListEditor(ov.querySelector("#f-steps"), ed?ed.steps:[], "Schritt beschreiben…", true);

  let submitting = false;   // verhindert Doppel-Eintrag durch Doppel-/Geister-Klick
  const saveBtn = ov.querySelector(".save");
  saveBtn.onclick=async()=>{
    if (submitting) return;
    const name=ov.querySelector("#f-name").value.trim();
    if(!name){ alert("Name fehlt"); return; }
    submitting = true; saveBtn.disabled = true; saveBtn.textContent = "Speichere…";
    const fields = {
      name,
      category: ov.querySelector("#f-cat").value,
      time: ov.querySelector("#f-time").value.trim(),
      servings: ov.querySelector("#f-serv").value.trim(),
      image: ov.querySelector("#f-image").value.trim(),
      ingredients: getIng(),
      steps: getSteps(),
      tips: ov.querySelector("#f-tips").value.trim(),
      effort: ov.querySelector("#f-effort").value,
      difficulty: ov.querySelector("#f-diff").value,
      cuisine: ov.querySelector("#f-cuisine").value.trim(),
      season: ov.querySelector("#f-season").value.trim(),
      mealPrep: ov.querySelector("#f-mealprep").checked,
      toTry: ov.querySelector("#f-totry").checked
    };
    try {
      if (ed){
        Object.assign(ed, fields);
      } else {
        DATA.recipes.unshift(Object.assign({
          id:"r"+Date.now(), lastCooked:"", rating:0, favorite:false, cookedCount:0, photos:[]
        }, fields));
      }
      await save(); close(); render();
      if (ed) openDetail(ed.id);   // nach dem Bearbeiten zurück zur Rezeptansicht
    } catch(err){
      submitting = false; saveBtn.disabled = false; saveBtn.textContent = "Speichern";
      alert("Speichern fehlgeschlagen: "+err.message);
    }
  };
}

/* ---------- Export ---------- */
function exportMd(){
  let md="# 📖 Rezept-Datenbank\n\n";
  CATEGORIES.forEach(cat=>{
    const items=DATA.recipes.filter(r=>r.category===cat);
    if(!items.length)return;
    md+=`## ${cat}\n\n`;
    items.forEach(r=>{
      md+=`### ${r.name}${r.rating?` (${"★".repeat(r.rating)})`:""}\n`;
      md+=`**Zeit:** ${r.time||"—"} | **Portionen:** ${r.servings||"—"} | **Zuletzt:** ${r.lastCooked||"—"}\n\n`;
      md+=`#### Zutaten\n${(r.ingredients||[]).map(i=>"- "+i).join("\n")}\n\n`;
      md+=`#### Zubereitung\n${(r.steps||[]).map((s,i)=>`${i+1}. ${s}`).join("\n")}\n\n`;
      if(r.tips)md+=`#### Tipps\n${r.tips}\n\n`;
    });
  });
  navigator.clipboard.writeText(md).then(()=>alert("Markdown in Zwischenablage kopiert!"));
}
