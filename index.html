<style>

<body>

<script>
/* ============================================================
   KONFIGURATION — von Claude Code ausgefüllt
   ============================================================ */
const GOOGLE_CLIENT_ID = "977952120262-lht1tbbinnj8kmehmvqe1dpu5gp7k8d8.apps.googleusercontent.com";
const FILE_NAME = "rezepte.json";
const SCOPE = "https://www.googleapis.com/auth/drive.file";

const CATEGORIES = [
  "Frühstück & Brunch","Schnelle Wochentags-Gerichte","Pasta & Nudeln",
  "Reis & Getreide","Suppen & Eintöpfe","Salate & leichte Gerichte",
  "Wochenend-Gerichte","Vegetarische Hauptgerichte","Deutsche Hausmannskost",
  "Middle Eastern & Mediterran","Asiatisch inspiriert","Backen: Brot & Herzhaftes",
  "Backen: Süßes & Kuchen","Muffins & Kleingebäck","Sourdough & Sauerteig",
  "Grundrezepte & Basissoßen"
];

/* ---------- App-Zustand ---------- */
let TOKEN = null, FILE_ID = null;
let DATA = { version: 2, updated: null, recipes: [] };
let query = "", activeCat = "Alle";
const imgCache = new Map(); // Drive-fileId -> Object-URL (Bilder werden authentifiziert geladen)

/* ============================================================
   GOOGLE DRIVE LAYER
   ============================================================ */
let tokenClient;
function initGoogle() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID, scope: SCOPE,
    callback: (resp) => { TOKEN = resp.access_token; afterLogin(); }
  });
}
function login(){ tokenClient.requestAccessToken(); }

async function driveFind() {
  const q = encodeURIComponent(`name='${FILE_NAME}' and trashed=false`);
  const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`,
    { headers: { Authorization: "Bearer " + TOKEN } });
  const j = await r.json();
  return j.files && j.files.length ? j.files[0].id : null;
}
async function driveRead(id) {
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,
    { headers: { Authorization: "Bearer " + TOKEN } });
  return r.json();
}
async function driveCreate(data) {
  const meta = { name: FILE_NAME, mimeType: "application/json" };
  const body = new FormData();
  body.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" }));
  body.append("file", new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  const r = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
    { method: "POST", headers: { Authorization: "Bearer " + TOKEN }, body });
  return (await r.json()).id;
}
async function driveUpdate(id, data) {
  await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,
    { method: "PATCH", headers: { Authorization: "Bearer " + TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify(data, null, 2) });
}
/* --- Bild-Dateien (eigene Drive-Dateien, per fileId referenziert) --- */
async function driveUploadImage(blob, name) {
  const meta = { name, mimeType: blob.type || "image/jpeg" };
  const body = new FormData();
  body.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" }));
  body.append("file", blob);
  const r = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
    { method: "POST", headers: { Authorization: "Bearer " + TOKEN }, body });
  return (await r.json()).id;
}
async function driveDelete(id) {
  try {
    await fetch(`https://www.googleapis.com/drive/v3/files/${id}`,
      { method: "DELETE", headers: { Authorization: "Bearer " + TOKEN } });
  } catch (e) { /* still missing? egal */ }
}
async function driveImageUrl(fileId) {
  if (imgCache.has(fileId)) return imgCache.get(fileId);
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
    { headers: { Authorization: "Bearer " + TOKEN } });
  if (!r.ok) throw new Error("Bild nicht ladbar");
  const url = URL.createObjectURL(await r.blob());
  imgCache.set(fileId, url);
  return url;
}

async function afterLogin() {
  setSync("Verbinde mit Drive…");
  FILE_ID = await driveFind();
  if (FILE_ID) {
    DATA = await driveRead(FILE_ID);
  } else {
    DATA = SEED;
    FILE_ID = await driveCreate(DATA);
  }
  normalize();
  render(); setSync("Synchronisiert ✓");
}
async function save() {
  DATA.updated = new Date().toISOString();
  DATA.version = 2;
  setSync("Speichere…");
  if (FILE_ID) await driveUpdate(FILE_ID, DATA);
  else FILE_ID = await driveCreate(DATA);
  setSync("Synchronisiert ✓");
}

/* Macht ältere Rezepte v1-kompatibel: ergänzt neue optionale Felder im Speicher. */
function normalize() {
  if (!DATA.recipes) DATA.recipes = [];
  DATA.recipes.forEach(r => {
    if (typeof r.rating !== "number") r.rating = 0;
    if (!Array.isArray(r.photos)) r.photos = [];
    if (typeof r.favorite !== "boolean") r.favorite = false;
    if (typeof r.cookedCount !== "number") r.cookedCount = 0;
    if (typeof r.image !== "string") r.image = r.image || "";
  });
}

/* ============================================================
   SEED-DATEN (erstes Rezept)
   ============================================================ */
const SEED = {
  version: 2, updated: new Date().toISOString(),
  recipes: [{
    id: "r01", name: "Süßkartoffel-Curry mit Kichererbsen",
    category: "Vegetarische Hauptgerichte", time: "35 Min", servings: "~4",
    lastCooked: "Mai 2026", rating: 0, favorite: false, cookedCount: 0, image: "", photos: [],
    ingredients: ["2 Süßkartoffeln, gewürfelt (~2 cm)","400g Kichererbsen (Dose, abgetropft)",
      "400ml Kokosmilch (Dose)","400g Dosentomaten","1 Zwiebel, gewürfelt","3 Knoblauchzehen, gehackt",
      "2 TL Curry, 1 TL Kreuzkümmel, ½ TL Chiliflocken","Salz, Pfeffer, Öl","Reis als Beilage"],
    steps: ["Reis aufsetzen.","Öl erhitzen, Zwiebel 3–4 Min glasig braten, Knoblauch 1 Min dazu.",
      "Gewürze einrühren, 1 Min anrösten.","Süßkartoffeln + Dosentomaten dazu, umrühren.",
      "Deckel drauf, 12–15 Min köcheln bis Süßkartoffeln weich.",
      "Kokosmilch + Kichererbsen einrühren, 5 Min weiterköcheln, abschmecken.","Über Reis servieren."],
    tips: "Joghurt oder Buttermilch drüber = frischer. Gefrorene Erbsen/Spinat am Ende einrühren."
  }]
};

/* ============================================================
   HELFER
   ============================================================ */
const $ = (h) => { const d = document.createElement("div"); d.innerHTML = h; return d.firstElementChild; };
const esc = (s) => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let syncMsg = "";
function setSync(m){ syncMsg = m; const e = document.querySelector(".sync"); if(e) e.textContent = m; }

function starsMini(n){ if(!n) return ""; return `<span class="rate-mini">${"★".repeat(n)}${"☆".repeat(5-n)}</span>`; }

/* Lädt das Titelbild (neuestes eigenes Foto, sonst Bild-URL) asynchron in ein Element. */
async function loadHeroInto(el, r){
  let url = null;
  if (r.photos && r.photos.length){ try { url = await driveImageUrl(r.photos[0].id); } catch(e){} }
  if (!url && r.image){ url = r.image; }
  if (url){ el.style.backgroundImage = `url("${url}")`; el.classList.add("has-img"); }
}
function hydrateImages(scope){
  (scope||document).querySelectorAll("[data-hero]").forEach(el=>{
    const r = DATA.recipes.find(x=>x.id===el.dataset.hero);
    if (r) loadHeroInto(el, r);
  });
}

/* Bild clientseitig verkleinern + als JPEG komprimieren, bevor es zu Drive geht. */
function compressImage(file, maxDim=1280, quality=0.72){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if (h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        c.toBlob(b => b ? res(b) : rej(new Error("Komprimierung fehlgeschlagen")), "image/jpeg", quality);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* Wiederverwendbarer Zeilen-Editor (Zutaten / Schritte). Gibt einen Getter zurück. */
function makeListEditor(mount, initial, ph, numbered){
  const wrap = document.createElement("div");
  function addRow(val){
    const row = $(`<div class="row">${numbered?'<span class="num"></span>':''}<input class="f"><button class="rm" type="button">✕</button></div>`);
    row.querySelector("input").value = val || "";
    row.querySelector("input").placeholder = ph;
    row.querySelector(".rm").onclick = () => { row.remove(); renum(); };
    row.querySelector("input").addEventListener("keydown", (e)=>{
      if (e.key === "Enter"){ e.preventDefault(); const nr = addRow(""); nr.querySelector("input").focus(); }
    });
    wrap.appendChild(row); renum(); return row;
  }
  function renum(){ if(!numbered) return;
    Array.from(wrap.querySelectorAll(".num")).forEach((n,i)=> n.textContent = (i+1)+"."); }
  const init = (initial && initial.length) ? initial : [""];
  init.forEach(v => addRow(v));
  const add = $(`<button class="addrow" type="button">+ Zeile hinzufügen</button>`);
  add.onclick = () => { const r = addRow(""); r.querySelector("input").focus(); };
  mount.appendChild(wrap); mount.appendChild(add);
  return () => Array.from(wrap.querySelectorAll("input")).map(i=>i.value.trim()).filter(Boolean);
}

/* ============================================================
   UI / RENDER
   ============================================================ */
function render() {
  const app = document.getElementById("app");
  if (!TOKEN) { app.innerHTML = loginView(); document.querySelector(".gbtn").onclick = login; return; }

  const usedCats = CATEGORIES.filter(c => DATA.recipes.some(r => r.category === c));
  const cats = ["Alle", "__fav", ...usedCats];
  const q = query.toLowerCase();
  const filtered = DATA.recipes.filter(r => {
    if (activeCat === "__fav"){ if (!r.favorite) return false; }
    else if (activeCat !== "Alle" && r.category !== activeCat) return false;
    return !q || r.name.toLowerCase().includes(q) ||
      (r.ingredients||[]).join(" ").toLowerCase().includes(q);
  });

  app.innerHTML = `
    <header>
      <div class="brand">
        <div class="brand-l">
          <span style="font-size:24px">🍳</span>
          <div><h1>Mein Kochbuch</h1>
          <div class="sub">${DATA.recipes.length} ${DATA.recipes.length===1?"Rezept":"Rezepte"}</div></div>
        </div>
        <button class="icon-btn" id="exportBtn" title="Export">⬇️</button>
      </div>
      <div class="search-wrap">
        <span>🔍</span>
        <input id="search" placeholder="Suchen nach Name oder Zutat…" value="${esc(query)}" />
      </div>
      <div class="chips">
        ${cats.map(c=>{
          const lbl = c==="Alle" ? "Alle" : c==="__fav" ? "♥ Favoriten"
            : c.split(":")[0].split(" & ")[0].split(" ")[0];
          return `<button class="chip ${activeCat===c?'active':''}" data-cat="${esc(c)}">${esc(lbl)}</button>`;
        }).join("")}
      </div>
    </header>
    <main>
      ${filtered.length===0
        ? `<p class="empty">${activeCat==="__fav"?"Noch keine Favoriten.<br>Öffne ein Rezept und tippe auf ♥.":"Noch keine Rezepte hier.<br>Tippe auf + um eins hinzuzufügen."}</p>`
        : filtered.map(r=>{
          const hasImg = (r.photos&&r.photos.length)||r.image;
          return `
          <div class="card" data-id="${r.id}">
            <button class="card-heart" data-fav="${r.id}">${r.favorite?"♥":"♡"}</button>
            ${hasImg?`<div class="card-thumb" data-hero="${r.id}"></div>`:""}
            <div class="cat">${esc(r.category)}</div>
            <div class="name">${esc(r.name)}</div>
            <div class="meta">${r.time?`⏱ ${esc(r.time)}`:""} ${r.lastCooked?`· ${esc(r.lastCooked)}`:""} ${starsMini(r.rating)}</div>
          </div>`;}).join("")}
    </main>
    <div class="sync">${esc(syncMsg)}</div>
    <button class="fab" id="addBtn">+</button>
  `;

  document.getElementById("search").oninput = (e)=>{ query=e.target.value; renderListOnly(); };
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ activeCat=b.dataset.cat; render(); });
  document.querySelectorAll(".card").forEach(b=>b.onclick=()=>openDetail(b.dataset.id));
  document.querySelectorAll(".card-heart").forEach(b=>b.onclick=async(e)=>{
    e.stopPropagation();
    const r = DATA.recipes.find(x=>x.id===b.dataset.fav); if(!r) return;
    r.favorite = !r.favorite; b.textContent = r.favorite?"♥":"♡"; await save();
  });
  document.getElementById("addBtn").onclick = () => openForm();
  document.getElementById("exportBtn").onclick = exportMd;
  hydrateImages();
}
function renderListOnly(){ render(); const i=document.getElementById("search");
  i.focus(); i.setSelectionRange(i.value.length,i.value.length); }

function loginView(){
  return `<div class="login">
    <span style="font-size:48px">🍳</span>
    <h2>Mein Kochbuch</h2>
    <p>Melde dich mit Google an. Deine Rezepte werden sicher in deinem Google Drive gespeichert und über alle Geräte synchronisiert.</p>
    <button class="gbtn">Mit Google anmelden</button>
  </div>`;
}

/* ---------- Detail-Ansicht ---------- */
function openDetail(id){
  const r = DATA.recipes.find(x=>x.id===id); if(!r) return;
  const ov = $(`<div class="overlay"></div>`);
  ov.innerHTML = `<div class="sheet">
    <div class="sheet-head">
      <span class="cat">${esc(r.category)}</span>
      <div class="hd-r">
        <button class="heart" title="Favorit">${r.favorite?"♥":"♡"}</button>
        <button class="icon-btn close">✕</button>
      </div>
    </div>
    <div class="hero" data-hero="${r.id}"></div>
    <div class="detail-name">${esc(r.name)}</div>
    <div class="stars" data-rate>${[1,2,3,4,5].map(i=>`<span class="star ${i<=r.rating?'on':''}" data-v="${i}">★</span>`).join("")}</div>
    <div class="meta">${r.time?`⏱ ${esc(r.time)}`:""} ${r.servings?`· 🍽 ${esc(r.servings)}`:""} ${r.cookedCount?`· ${r.cookedCount}× gekocht`:""}</div>
    ${r.lastCooked?`<p style="font-size:13px;color:rgba(42,31,23,.5);font-style:italic;margin-top:4px">Zuletzt gekocht: ${esc(r.lastCooked)}</p>`:""}

    <button class="photo-add">📷 Foto aufnehmen oder hochladen</button>
    ${r.photos&&r.photos.length?`<div class="photostrip">${r.photos.map(p=>`
      <div class="ph"><div class="thumb" data-photo="${p.id}"></div><button class="rm" data-rm="${p.id}">✕</button></div>`).join("")}</div>`:""}

    ${r.ingredients&&r.ingredients.length?`<h3>Zutaten</h3><ul>${r.ingredients.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:""}
    ${r.steps&&r.steps.length?`<h3>Zubereitung</h3><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`:""}
    ${r.tips?`<h3>Tipps</h3><p class="tips">${esc(r.tips)}</p>`:""}

    <div class="actions">
      <button class="btn-primary btn-cook cook">👨‍🍳 Kochmodus</button>
      <button class="btn-primary cooked">✓ Heute gekocht</button>
      <button class="btn-sec edit">✎ Bearbeiten</button>
      <button class="btn-sec btn-del del">🗑 Löschen</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.onclick=(e)=>{ if(e.target===ov) close(); };
  ov.querySelector(".close").onclick=close;

  // Titelbild + Foto-Thumbnails laden
  hydrateImages(ov);
  ov.querySelectorAll("[data-photo]").forEach(el=>{
    driveImageUrl(el.dataset.photo).then(u=>{ el.style.backgroundImage=`url("${u}")`; }).catch(()=>{});
  });

  // Bewertung
  ov.querySelectorAll("[data-rate] .star").forEach(s=>s.onclick=async()=>{
    const v = +s.dataset.v;
    r.rating = (r.rating === v) ? v-1 : v;  // gleichen Stern nochmal = eins runter
    ov.querySelectorAll("[data-rate] .star").forEach(x=>x.classList.toggle("on", +x.dataset.v<=r.rating));
    await save();
  });

  // Favorit
  ov.querySelector(".heart").onclick=async(e)=>{
    r.favorite=!r.favorite; e.target.textContent=r.favorite?"♥":"♡"; await save();
  };

  // Foto aufnehmen/hochladen
  ov.querySelector(".photo-add").onclick=()=>{
    const inp=document.getElementById("photoInput");
    inp.onchange=async()=>{
      const f=inp.files&&inp.files[0]; inp.value="";
      if(!f) return;
      setSync("Foto wird hochgeladen…");
      try{
        const blob=await compressImage(f);
        const fid=await driveUploadImage(blob, `kochbuch-foto-${r.id}-${Date.now()}.jpg`);
        r.photos.unshift({ id: fid, added: new Date().toISOString() });
        await save(); close(); openDetail(r.id); render();
      }catch(err){ alert("Foto fehlgeschlagen: "+err.message); setSync(""); }
    };
    inp.click();
  };

  // Foto löschen
  ov.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Foto löschen?")) return;
    const fid=b.dataset.rm;
    r.photos=r.photos.filter(p=>p.id!==fid);
    imgCache.delete(fid);
    await save(); driveDelete(fid);
    close(); openDetail(r.id); render();
  });

  // Aktionen
  ov.querySelector(".cook").onclick=()=>{ close(); openCook(r.id); };
  ov.querySelector(".edit").onclick=()=>{ close(); openForm(r); };
  ov.querySelector(".cooked").onclick=async()=>{
    r.lastCooked=new Date().toLocaleDateString("de-DE",{month:"long",year:"numeric"});
    r.cookedCount=(r.cookedCount||0)+1;
    await save(); close(); render();
  };
  ov.querySelector(".del").onclick=async()=>{
    if(!confirm("Rezept wirklich löschen?"))return;
    (r.photos||[]).forEach(p=>driveDelete(p.id)); // Fotos in Drive mit aufräumen
    DATA.recipes=DATA.recipes.filter(x=>x.id!==id);
    await save(); close(); render();
  };
}

/* ---------- Kochmodus (Vollbild, Bildschirm bleibt an) ---------- */
let wakeLock=null;
async function reqWake(){ try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }catch(e){} }
function relWake(){ try{ wakeLock&&wakeLock.release(); }catch(e){} wakeLock=null; }

function openCook(id){
  const r = DATA.recipes.find(x=>x.id===id); if(!r) return;
  const view = $(`<div class="cook"></div>`);
  view.innerHTML = `
    <div class="cook-top">
      <span class="ct">Kochmodus</span>
      <button class="icon-btn close">✕</button>
    </div>
    <h2>${esc(r.name)}</h2>
    <div class="wakeinfo">📱 Bildschirm bleibt im Kochmodus an. Tippe Zutaten/Schritte zum Abhaken.</div>
    ${r.ingredients&&r.ingredients.length?`<div class="cook-sec">Zutaten</div>
      ${r.ingredients.map(i=>`<div class="cook-ing"><span class="tick"></span><span>${esc(i)}</span></div>`).join("")}`:""}
    ${r.steps&&r.steps.length?`<div class="cook-sec">Zubereitung</div>
      ${r.steps.map((s,i)=>`<div class="cook-step"><span class="cook-num">${i+1}</span><span>${esc(s)}</span></div>`).join("")}`:""}
    <button class="cook-done-btn done-btn">Fertig — zurück</button>
  `;
  document.body.appendChild(view);
  reqWake();
  const exit=()=>{ relWake(); view.remove(); };
  view.querySelector(".close").onclick=exit;
  view.querySelector(".done-btn").onclick=exit;
  view.querySelectorAll(".cook-ing, .cook-step").forEach(el=>el.onclick=()=>el.classList.toggle("done"));
}

/* ---------- Formular: Neu + Bearbeiten ---------- */
function openForm(existing){
  const ed = existing || null;
  const ov = $(`<div class="overlay"></div>`);
  ov.innerHTML = `<div class="sheet">
    <div class="sheet-head"><span class="cat">${ed?"Rezept bearbeiten":"Neues Rezept"}</span><button class="icon-btn close">✕</button></div>
    <label>Name</label><input class="f" id="f-name" placeholder="z.B. Linsensuppe" />
    <label>Kategorie</label><select class="f" id="f-cat">${CATEGORIES.map(c=>`<option ${ed&&ed.category===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label>Zeit</label><input class="f" id="f-time" placeholder="25 Min" /></div>
      <div style="flex:1"><label>Portionen</label><input class="f" id="f-serv" value="~4" /></div>
    </div>
    <label>Bild-URL (optional)</label><input class="f" id="f-image" placeholder="https://… (Titelbild)" />
    <label>Zutaten</label><div id="f-ing"></div>
    <label>Zubereitung</label><div id="f-steps"></div>
    <label>Tipps (optional)</label><textarea class="f" id="f-tips" rows="2"></textarea>
    <button class="save">Speichern</button>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.onclick=(e)=>{ if(e.target===ov) close(); };
  ov.querySelector(".close").onclick=close;

  if (ed){
    ov.querySelector("#f-name").value = ed.name || "";
    ov.querySelector("#f-time").value = ed.time || "";
    ov.querySelector("#f-serv").value = ed.servings || "";
    ov.querySelector("#f-image").value = ed.image || "";
    ov.querySelector("#f-tips").value = ed.tips || "";
  }
  const getIng = makeListEditor(ov.querySelector("#f-ing"), ed?ed.ingredients:[], "z.B. 2 Eier", false);
  const getSteps = makeListEditor(ov.querySelector("#f-steps"), ed?ed.steps:[], "Schritt beschreiben…", true);

  ov.querySelector(".save").onclick=async()=>{
    const name=ov.querySelector("#f-name").value.trim();
    if(!name){ alert("Name fehlt"); return; }
    const fields = {
      name,
      category: ov.querySelector("#f-cat").value,
      time: ov.querySelector("#f-time").value.trim(),
      servings: ov.querySelector("#f-serv").value.trim(),
      image: ov.querySelector("#f-image").value.trim(),
      ingredients: getIng(),
      steps: getSteps(),
      tips: ov.querySelector("#f-tips").value.trim()
    };
    if (ed){
      Object.assign(ed, fields);
    } else {
      DATA.recipes.unshift(Object.assign({
        id:"r"+Date.now(), lastCooked:"", rating:0, favorite:false, cookedCount:0, photos:[]
      }, fields));
    }
    await save(); close(); render();
  };
}

/* ---------- Export ---------- */
function exportMd(){
  let md="# 📖 Rezept-Datenbank\n\n";
  CATEGORIES.forEach(cat=>{
    const items=DATA.recipes.filter(r=>r.category===cat);
    if(!items.length)return;
    md+=`## ${cat}\n\n`;
    items.forEach(r=>{
      md+=`### ${r.name}${r.rating?` (${"★".repeat(r.rating)})`:""}\n`;
      md+=`**Zeit:** ${r.time||"—"} | **Portionen:** ${r.servings||"—"} | **Zuletzt:** ${r.lastCooked||"—"}\n\n`;
      md+=`#### Zutaten\n${(r.ingredients||[]).map(i=>"- "+i).join("\n")}\n\n`;
      md+=`#### Zubereitung\n${(r.steps||[]).map((s,i)=>`${i+1}. ${s}`).join("\n")}\n\n`;
      if(r.tips)md+=`#### Tipps\n${r.tips}\n\n`;
    });
  });
  navigator.clipboard.writeText(md).then(()=>alert("Markdown in Zwischenablage kopiert!"));
}
